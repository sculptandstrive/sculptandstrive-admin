<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        function isIgnored(msg) {
          if (!msg) return false;
          var str = typeof msg === 'string' ? msg : (msg.message || msg.reason || String(msg));
          return str.indexOf('startTime') !== -1 ||
                 str.indexOf('reportAllChanges') !== -1 ||
                 str.indexOf('requestIdleCallback') !== -1;
        }
        var prevOnError = window.onerror;
        window.onerror = function(msg, url, line, col, error) {
          if (isIgnored(msg) || isIgnored(error)) return true;
          if (prevOnError) return prevOnError.apply(this, arguments);
        };
        window.addEventListener('error', function(e) {
          if (isIgnored(e.message) || isIgnored(e.error)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (isIgnored(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sculpt & Strive | Admin Dashboard</title>
    <meta name="description" content="Admin dashboard for Sculpt and Strive fitness platform - manage sessions, trainers, members, and more." />

  </head>

  </body>
</html>
